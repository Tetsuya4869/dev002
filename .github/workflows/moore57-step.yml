name: Moore57 stepwise extension

on:
  push:
    branches:
      - agent/moore57-formal-verification
    paths:
      - 'research/moore57_formal/search/seeds/moore56-t10.json'
      - '.github/workflows/moore57-step.yml'
  workflow_dispatch:

jobs:
  extend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - { name: extend-t10-to-t11, t: 11, seconds: 300 }
          - { name: extend-t10-to-t12, t: 12, seconds: 600 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently verify t10 seed
        run: |
          python research/moore57_formal/search/verify_solution.py \
            research/moore57_formal/search/seeds/moore56-t10.json
      - name: Install OR-Tools
        run: python -m pip install 'ortools==9.15.6755'
      - name: Search extension
        run: |
          mkdir -p research/moore57_formal/search/results
          python research/moore57_formal/search/all_involution_cp_sat.py \
            --n 56 --t ${{ matrix.case.t }} \
            --seconds ${{ matrix.case.seconds }} --workers 4 --seed 29 \
            --fix-report research/moore57_formal/search/seeds/moore56-t10.json \
            --output research/moore57_formal/search/results/${{ matrix.case.name }}.json
      - name: Independently verify any returned extension
        run: |
          REPORT=research/moore57_formal/search/results/${{ matrix.case.name }}.json
          python - "$REPORT" <<'PY'
          import json, subprocess, sys
          report=sys.argv[1]
          data=json.load(open(report, encoding='utf-8'))
          if 'solution' not in data:
              print(f"No extension certificate (status={data.get('status')})")
              raise SystemExit(0)
          subprocess.run([sys.executable,'research/moore57_formal/search/verify_solution.py',report],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.case.name }}
          path: research/moore57_formal/search/results/${{ matrix.case.name }}.json
