name: Moore57 seed group analysis

on:
  push:
    branches:
      - agent/moore57-formal-verification
    paths:
      - 'research/moore57_formal/search/group_analysis.py'
      - 'research/moore57_formal/search/seeds/**'
      - '.github/workflows/moore57-group-analysis.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [moore56-t6, moore56-t8, moore56-t10, moore56-t10-cadical]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SymPy
        run: python -m pip install 'sympy==1.14.0'
      - name: Verify certificate independently
        run: |
          python research/moore57_formal/search/verify_solution.py \
            research/moore57_formal/search/seeds/${{ matrix.seed }}.json
      - name: Analyze generated permutation group
        run: |
          mkdir -p research/moore57_formal/search/results
          python research/moore57_formal/search/group_analysis.py \
            research/moore57_formal/search/seeds/${{ matrix.seed }}.json \
            --output research/moore57_formal/search/results/${{ matrix.seed }}-group.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.seed }}-group
          path: research/moore57_formal/search/results/${{ matrix.seed }}-group.json
