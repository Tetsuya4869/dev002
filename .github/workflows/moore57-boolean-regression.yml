name: Moore57 Boolean encoding regression

on:
  push:
    branches:
      - agent/moore57-formal-verification
    paths:
      - 'research/moore57_formal/search/extend_one_boolean_cp_sat.py'
      - 'research/moore57_formal/search/seeds/moore56-t8.json'
      - 'research/moore57_formal/search/seeds/moore56-t9.json'
      - '.github/workflows/moore57-boolean-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - { name: t8-to-t9, seed: moore56-t8, seconds: 120, random_seed: 401 }
          - { name: t9-to-t10, seed: moore56-t9, seconds: 180, random_seed: 402 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify input certificate
        run: python research/moore57_formal/search/verify_solution.py research/moore57_formal/search/seeds/${{ matrix.case.seed }}.json
      - name: Install OR-Tools
        run: python -m pip install 'ortools==9.15.6755'
      - name: Run Boolean extension regression
        run: |
          mkdir -p research/moore57_formal/search/results
          python research/moore57_formal/search/extend_one_boolean_cp_sat.py \
            research/moore57_formal/search/seeds/${{ matrix.case.seed }}.json \
            --seconds ${{ matrix.case.seconds }} --workers 4 --seed ${{ matrix.case.random_seed }} \
            --output research/moore57_formal/search/results/boolean-${{ matrix.case.name }}.json
      - name: Require SAT and independently verify
        run: |
          REPORT=research/moore57_formal/search/results/boolean-${{ matrix.case.name }}.json
          python - "$REPORT" <<'PY'
          import json, subprocess, sys
          p=sys.argv[1]
          d=json.load(open(p, encoding='utf-8'))
          if 'solution' not in d:
              raise SystemExit(f"REGRESSION FAILURE: known extendable case returned {d.get('status')}")
          subprocess.run([sys.executable,'research/moore57_formal/search/verify_solution.py',p],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: boolean-${{ matrix.case.name }}
          path: research/moore57_formal/search/results/boolean-${{ matrix.case.name }}.json
